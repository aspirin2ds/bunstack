name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb_test
      # The web app validates its environment at import time, so `typecheck` and
      # the OpenAPI step below need this present even though nothing calls the API.
      API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # One install for every workspace; the lockfile at the root covers them all.
      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      # RULES.md checks that Biome cannot express (layering, env docs, unused
      # deps, route declaration style, migration immutability, workspace
      # boundaries, Bun-vs-Node APIs).
      - name: Rule checks
        run: bun run check:rules

      # Covers all three workspaces. The web app's typecheck is the one that
      # proves the typed API client still resolves across the workspace boundary.
      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      # Runs in its own process: mock.module in the route tests would otherwise
      # leak the mocked service layer into these.
      - name: Integration tests
        run: bun run test:integration

      # The suite skips itself when no database is reachable, which would let a
      # broken connection pass as green. Assert it actually ran.
      - name: Assert integration tests were not skipped
        run: |
          bun run test:integration 2>&1 | tee /tmp/it.log
          if grep -q 'skipping integration tests' /tmp/it.log; then
            echo "::error::Integration tests skipped - Postgres was unreachable"
            exit 1
          fi

      # RULES.md VAL-03: catches schema mistakes that are invalid OpenAPI, such
      # as z.unknown() emitting `nullable` with no `type`.
      - name: Validate the OpenAPI document
        working-directory: apps/api
        run: |
          bun -e 'const {app}=await import("./src/app.ts");
                  const r=await app.request("/openapi.json");
                  await Bun.write("openapi.json", await r.text())'
          bunx --bun --yes @redocly/cli@latest lint openapi.json --extends=minimal
          rm -f openapi.json

      - name: Check migrations match schema
        run: |
          bun run db:generate
          if ! git diff --quiet -- apps/api/drizzle; then
            echo "::error::apps/api/src/db/schema.ts changed without a committed migration."
            git diff --stat -- apps/api/drizzle
            exit 1
          fi

      # The route tree is generated by the Vite plugin but committed, so a stale
      # copy would only surface at build time. Regenerate and diff.
      - name: Check the route tree is up to date
        run: |
          bun run build
          if ! git diff --quiet -- apps/web/src/routeTree.gen.ts; then
            echo "::error::apps/web/src/routeTree.gen.ts is stale. Run 'bun run build' and commit it."
            git diff -- apps/web/src/routeTree.gen.ts
            exit 1
          fi

  docker:
    name: docker build + stack smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds the API's `test` stage, which runs typecheck and unit tests in-image.
      - name: Build API image (runs in-image checks)
        run: docker build --target test -f apps/api/Dockerfile -t api:test .

      - name: Build release images
        run: |
          docker build --target release -f apps/api/Dockerfile -t api:release .
          docker build --target release -f apps/web/Dockerfile -t web:release .

      # End-to-end: Postgres -> one-shot migrate -> api -> web, then hit both.
      # This is what catches wiring that unit tests cannot see — a connection URL
      # that only fails inside a container, or a workspace symlink whose target
      # was not copied into the release stage (RULES.md WS-08).
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      # Uses jq, not bun: this job deliberately has no Bun toolchain, because it
      # tests the built images the way a deployment would. jq is preinstalled on
      # GitHub-hosted runners.
      - name: Smoke test the API
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/health/db

          # The spec and its UI must actually be served by the release image.
          curl -fsS http://localhost:3000/openapi.json \
            | jq -e '.openapi and (.paths | has("/api/users"))' >/dev/null
          curl -fsS http://localhost:3000/docs -o /dev/null

          id=$(curl -fsS -X POST http://localhost:3000/api/users \
                 -H 'content-type: application/json' \
                 -d '{"email":"ci@example.com","name":"CI User"}' \
               | jq -re '.data.id')

          curl -fsS "http://localhost:3000/api/users/$id" >/dev/null

          # A duplicate must be a 409, not a 500. (Named `code`, not `status`:
          # the latter is read-only in some shells.)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/users \
                   -H 'content-type: application/json' \
                   -d '{"email":"ci@example.com","name":"Dup"}')
          [ "$code" = "409" ] || { echo "expected 409, got $code"; exit 1; }

          echo "API smoke test passed"

      # The web assertions are the ones that prove the two services are actually
      # talking: the user created above has to appear in server-rendered HTML,
      # having travelled web -> typed client -> API -> Postgres and back.
      - name: Smoke test the web app
        run: |
          set -euo pipefail

          # / redirects to /users.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/)
          [ "$code" = "307" ] || { echo "expected 307 from /, got $code"; exit 1; }

          html=$(curl -fsS http://localhost:3001/users)

          # `if` rather than `grep ... && { exit 1; }`: under `set -e` a failing
          # grep in an AND-list takes the whole script down, so the negative
          # assertions below would "pass" by aborting the step.
          if ! grep -q 'CI User' <<<"$html"; then
            echo "user not server-rendered; web is not reaching the API"; exit 1
          fi
          if ! grep -q 'ci@example.com' <<<"$html"; then
            echo "email missing from SSR output"; exit 1
          fi

          # The dev JSX transform in a production image renders nothing but
          # "jsxDEV is not a function" — assert the build was a production build.
          if grep -q 'jsxDEV' <<<"$html"; then
            echo "dev JSX transform in release image"; exit 1
          fi

          # API_URL is an internal hostname and must never reach the browser.
          if grep -q 'api:3000' <<<"$html"; then
            echo "internal API URL leaked to client"; exit 1
          fi

          # A missing asset must 404, not return the app shell with a 200.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/assets/nope.js)
          [ "$code" = "404" ] || { echo "expected 404 for missing asset, got $code"; exit 1; }

          # Path traversal out of dist/client must be refused (RULES.md SEC-05).
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is \
                   'http://localhost:3001/assets/../../../etc/passwd')
          [ "$code" = "404" ] || { echo "path traversal not refused, got $code"; exit 1; }

          echo "web smoke test passed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
