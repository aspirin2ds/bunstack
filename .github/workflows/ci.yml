name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      # Runs in its own process: mock.module in the route tests would otherwise
      # leak the mocked service layer into these.
      - name: Integration tests
        run: bun run test:integration

      # The suite skips itself when no database is reachable, which would let a
      # broken connection pass as green. Assert it actually ran.
      - name: Assert integration tests were not skipped
        run: |
          bun run test:integration 2>&1 | tee /tmp/it.log
          if grep -q 'skipping integration tests' /tmp/it.log; then
            echo "::error::Integration tests skipped - Postgres was unreachable"
            exit 1
          fi

      - name: Check migrations match schema
        run: |
          bun run db:generate
          if ! git diff --quiet -- drizzle; then
            echo "::error::src/db/schema.ts changed without a committed migration."
            git diff --stat -- drizzle
            exit 1
          fi

  docker:
    name: docker build + stack smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds the `test` stage, which runs typecheck and unit tests in-image.
      - name: Build image (runs in-image checks)
        run: docker build --target test -t app:test .

      - name: Build release image
        run: docker build --target release -t app:release .

      # End-to-end: Postgres -> one-shot migrate -> app, then hit it. This is
      # what catches wiring that unit tests cannot see, such as a connection
      # URL that only fails inside a container.
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/health/db

          # The spec and its UI must actually be served by the release image.
          curl -fsS http://localhost:3000/openapi.json | bun -e '
            const d = JSON.parse(await Bun.stdin.text())
            if (!d.openapi || !d.paths?.["/api/users"]) throw new Error("bad OpenAPI document")
            console.log("openapi ok:", Object.keys(d.paths).length, "paths")
          '
          curl -fsS http://localhost:3000/docs -o /dev/null

          id=$(curl -fsS -X POST http://localhost:3000/api/users \
                 -H 'content-type: application/json' \
                 -d '{"email":"ci@example.com","name":"CI"}' \
               | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).data.id)')

          curl -fsS "http://localhost:3000/api/users/$id" >/dev/null

          # A duplicate must be a 409, not a 500. (Named `code`, not `status`:
          # the latter is read-only in some shells.)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/users \
                   -H 'content-type: application/json' \
                   -d '{"email":"ci@example.com","name":"Dup"}')
          [ "$code" = "409" ] || { echo "expected 409, got $code"; exit 1; }

          curl -fsS -X DELETE "http://localhost:3000/api/users/$id" -o /dev/null
          echo "smoke test passed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
