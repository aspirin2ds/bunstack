services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ wants ONE mount at /var/lib/postgresql, not the older
      # /var/lib/postgresql/data. It stores data in a version-specific
      # subdirectory so `pg_upgrade --link` can work across a single mount
      # point. Mounting .../data makes 18 refuse to start:
      #   "there appears to be PostgreSQL data in /var/lib/postgresql/data
      #    (unused mount/volume)"
      # https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. The app waits for it to succeed, so
  # `docker compose up` always starts against a migrated database.
  migrate:
    build:
      context: .
      target: release
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-appdb}
    command: ['bun', 'src/db/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: release
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-appdb}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD-SHELL', 'bun -e "await fetch(\"http://localhost:3000/health\").then(r=>process.exit(r.ok?0:1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
